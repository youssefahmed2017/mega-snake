name: Build cross-platform binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: MegaSnake-Windows
            output_path: dist/MegaSnake.exe
            pyinstaller_args: --onefile --windowed --add-data "assets/fonts;assets/fonts" --add-data "assets/art;assets/art"
          - os: macos-latest
            artifact_name: MegaSnake-macOS
            output_path: dist/MegaSnake.app.zip
            pyinstaller_args: --windowed --add-data "assets/fonts:assets/fonts" --add-data "assets/art:assets/art"
          - os: ubuntu-latest
            artifact_name: MegaSnake-Linux
            output_path: dist/MegaSnake
            pyinstaller_args: --onefile --add-data "assets/fonts:assets/fonts" --add-data "assets/art:assets/art"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install SDL runtime deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 libsdl2-ttf-2.0-0

      - name: Build with PyInstaller
        run: pyinstaller ${{ matrix.pyinstaller_args }} --collect-data certifi --name MegaSnake main.py

      - name: Zip the .app bundle (macOS)
        if: matrix.os == 'macos-latest'
        # ditto (not zip/Compress-Archive) is Apple's recommended way to
        # archive an .app bundle - it preserves the executable bit, symlinks,
        # and extended attributes that a plain zip can silently drop.
        run: ditto -c -k --sequesterRsrc --keepParent dist/MegaSnake.app dist/MegaSnake.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_path }}
          if-no-files-found: error

  release:
    # Only on a version tag (v1.6.0, ...) - the updater needs a stable, public,
    # non-expiring download URL per version. Workflow-run artifacts expire and
    # require auth to fetch, so they can't serve that role; a GitHub Release's
    # assets can.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false

      - name: Flatten and rename release assets
        run: |
          mkdir -p out
          cp release-assets/MegaSnake-Windows/MegaSnake.exe out/MegaSnake-Windows.exe
          cp release-assets/MegaSnake-macOS/MegaSnake.app.zip out/MegaSnake-macOS.zip
          cp release-assets/MegaSnake-Linux/MegaSnake out/MegaSnake-Linux

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          make_latest: true
